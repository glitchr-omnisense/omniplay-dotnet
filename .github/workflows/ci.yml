# The package's CI: the tests (omniplay's vectors, the heartbeat, the gate), the README's first call
# run and its output compared, and the NuGet package packed; the UPM manifest checked against the
# csproj (the same version) and every asset of the UPM package having its .meta.
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:
  # release.yml runs this CI on a tag before the release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test 'Dotnet~/Tests' -c Release

      - name: The README's first call
        run: |
          set -eu
          out=$(dotnet run --project 'Dotnet~/Examples/FirstCall' -c Release)
          printf '%s\n' "$out"
          [ "$out" = "$(printf 'player-42\nTrue\nplayer-7')" ] || { echo "::error::The first call printed something else."; exit 1; }

      - name: The NuGet package
        run: dotnet pack 'Dotnet~/Omniplay.Dotnet.csproj' -c Release -o out

      - name: The UPM package
        run: |
          set -eu
          upm=$(jq -r .version package.json)
          nuget=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' 'Dotnet~/Omniplay.Dotnet.csproj')
          [ "$upm" = "$nuget" ] || { echo "::error::package.json says $upm, the csproj $nuget."; exit 1; }
          missing=0
          for f in $(git ls-files | grep -v -E '^(\.|Dotnet~/)' | grep -v '\.meta$'); do
            [ -f "$f.meta" ] || { echo "::error::$f has no .meta"; missing=1; }
          done
          for d in $(git ls-files | grep -v -E '^(\.|Dotnet~/)' | grep / | sed 's:/[^/]*$::' | sort -u); do
            [ -f "$d.meta" ] || { echo "::error::$d/ has no .meta"; missing=1; }
          done
          dup=$(git ls-files '*.meta' | xargs sed -n 's/^guid: //p' | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::GUIDs used twice: $dup"; missing=1; }
          exit $missing

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: out/
